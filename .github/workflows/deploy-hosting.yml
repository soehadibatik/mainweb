name: Deploy to Domainesia Hosting

# Static export (out/) -> folder domain di shared hosting Domainesia via SSH + tar.
# Perlu repo Variables + Secret, lihat docs/DEPLOY-DOMAINESIA.md.
#
# Kalau konfigurasi belum diisi, job SKIP (hijau) — bukan gagal. Jadi aman
# dipush ke branch main project yang hosting-nya belum disiapkan.
#
# PENTING: sengaja TIDAK memakai rsync. Di shared hosting ini rsync terbukti
# dua kali bermasalah: pernah berakhir sukses tanpa menaruh file sama sekali,
# dan pernah menghapus aset _next/static yang seharusnya dikecualikan —
# itulah sebabnya sering ada laporan "style hilang" setelah deploy.
# Tar over SSH murni mengekstrak (merge, tidak menghapus), jadi urutan
# amannya bisa dijamin: aset build baru masuk lebih dulu, HTML ditukar
# kemudian, dan verifikasi CSS menjadi gerbang akhir deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting-${{ github.ref }}
  cancel-in-progress: false

env:
  H_HOST: ${{ vars.HOSTING_HOST }}
  H_USER: ${{ vars.HOSTING_USER }}
  H_PATH: ${{ vars.HOSTING_PATH }}
  H_PORT: ${{ vars.HOSTING_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check hosting config
        id: cfg
        env:
          KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$H_HOST" ] || [ -z "$H_USER" ] || [ -z "$H_PATH" ] || [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Deploy hosting di-skip"
              echo
              echo "Konfigurasi belum lengkap. Isi repo **Variables**:"
              echo '`HOSTING_HOST`, `HOSTING_USER`, `HOSTING_PATH`, `HOSTING_PORT`'
              echo "dan secret \`HOSTING_SSH_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "target=$H_USER@$H_HOST:$H_PATH (port ${H_PORT:-64000})" >> "$GITHUB_STEP_SUMMARY"

      - name: Siapkan SSH
        if: steps.cfg.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            echo "Host hosting"
            echo "  HostName $H_HOST"
            # Domainesia shared hosting: SSH/SFTP = port 64000 (bukan 22)
            echo "  Port ${H_PORT:-64000}"
            echo "  User $H_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Koneksi SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh hosting 'echo "connected as $(whoami)@$(hostname)"; pwd'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        if: steps.cfg.outputs.enabled == 'true'
        run: npm ci

      # Build static export butuh API key: generateStaticParams() memanggil
      # /api/v1/articles, dan tanpa key hasilnya 401 -> params kosong ->
      # Next.js gagal dengan "missing generateStaticParams()".
      - name: Tulis .env dari secrets
        if: steps.cfg.outputs.enabled == 'true'
        env:
          API_KEY: ${{ secrets.BATIKSOEHADI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$API_KEY" ]; then
            printf 'BATIKSOEHADI_API_KEY=%s\n' "$API_KEY" > .env
          else
            echo "::warning::Secret BATIKSOEHADI_API_KEY kosong — build bisa gagal di route dinamis"
            : > .env
          fi

      - name: npm run build
        if: steps.cfg.outputs.enabled == 'true'
        run: npm run build

      - name: Validasi out/
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "::error::out/index.html tidak ada — static export gagal?"; exit 1; }
          echo "out/ berisi $(find out -type f | wc -l | tr -d ' ') file" >> "$GITHUB_STEP_SUMMARY"

      - name: Pastikan folder tujuan ada
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh hosting "mkdir -p '$H_PATH' && test -d '$H_PATH'" \
            || { echo "::error::Gagal menyiapkan '$H_PATH'. Cek HOSTING_PATH & hak akses folder."; exit 1; }

      # === Urutan anti "style hilang" ===
      # 1) Header cache: HTML selalu revalidasi, aset ber-hash cache setahun.
      # 2) Aset _next/static build baru diunggah TANPA menghapus yang lama.
      # 3) HTML & konten lain ditukar paling akhir.
      # 4) Verifikasi: CSS wajib ada di server DAN terbaca publik.
      - name: Pasang header cache (.htaccess)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cat > /tmp/htaccess-cache <<'HTACCESS'

          # BEGIN mainweb-cache (dipasang otomatis oleh GitHub Actions)
          # HTML tanpa cache: deploy baru langsung terlihat.
          # Aset ber-hash: aman di-cache setahun.
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 0 seconds"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType text/javascript "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType image/svg+xml "access plus 1 month"
            ExpiresByType image/webp "access plus 1 month"
            ExpiresByType image/x-icon "access plus 1 month"
          </IfModule>
          <IfModule mod_headers.c>
            <FilesMatch "\.(css|js|mjs|woff2)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          # END mainweb-cache
          HTACCESS
          # Idempoten: blok hanya di-append jika belum ada; .htaccess milik
          # cPanel tidak pernah ditimpa. Indentasi YAML dibuang saat masuk.
          sed 's/^          //' /tmp/htaccess-cache \
            | ssh hosting "grep -q 'BEGIN mainweb-cache' '$H_PATH/.htaccess' 2>/dev/null || cat >> '$H_PATH/.htaccess'"
          ssh hosting "tail -3 '$H_PATH/.htaccess'"

      # Langkah 2: aset baru masuk duluan, aset lama dibiarkan hidup. Aman
      # karena nama file di-hash dari isinya: nama sama pasti isi sama.
      - name: Unggah aset _next/static lebih dulu
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          CSS=$(grep -o '/_next/static/[^"]*\.css' out/index.html | head -1)
          [ -n "$CSS" ] || { echo "::error::out/index.html tidak merujuk CSS"; exit 1; }
          ssh hosting "mkdir -p '$H_PATH/_next/static'"
          tar -C out -cf - _next/static \
            | ssh hosting "cd '$H_PATH' && tar -xf -"
          ssh hosting "test -f '$H_PATH$CSS'" \
            || { echo "::error::aset $CSS gagal terpasang di hosting"; exit 1; }
          echo "aset ok: $CSS"

      # Langkah 3: konten (HTML, gambar, dsb). Ekstraksi tar mengganti file
      # yang namanya sama dan TIDAK menghapus yang lain. HTML lama di server
      # dihapus lebih dulu supaya rute yang sudah tidak ada tak tertinggal;
      # ini tidak memengaruhi HTML yang masih tersimpan di cache browser,
      # asetnya tetap tersedia selama masa tenggang.
      # File cPanel (.htaccess, .user.ini, php.ini, .well-known/) tidak ada di
      # out/ sehingga tidak pernah tersentuh.
      - name: Tukar konten situs (HTML paling akhir)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ssh hosting "find '$H_PATH' -name '*.html' -not -path '*/.well-known/*' -delete 2>/dev/null || true"
          tar --exclude='./_next/static' -C out -cf - . \
            | ssh hosting "cd '$H_PATH' && tar -xf -"
          ssh hosting "test -f '$H_PATH/index.html'" \
            || { echo "::error::index.html gagal terpasang"; exit 1; }

      - name: Pastikan file cPanel masih ada
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ssh hosting "
            miss=0
            for f in .htaccess .user.ini php.ini; do
              [ -f '$H_PATH'/\$f ] || { echo \"::error::\$f hilang di \$H_PATH\"; miss=1; }
            done
            [ -d '$H_PATH'/.well-known ] || { echo \"::error::.well-known hilang di \$H_PATH\"; miss=1; }
            exit \$miss
          "

      - name: Verifikasi
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ssh hosting "ls -1 '$H_PATH' | head -20"
          {
            echo
            echo "### ✅ Ter-deploy ke \`$H_USER@$H_HOST:$H_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sengaja TIDAK ada langkah pembersihan aset otomatis. Di server ini
      # rsync pernah menghapus aset yang seharusnya aman, dan setelah beralih
      # ke tar pun aset baru sempat hilang di sekitar langkah pembersih.
      # Total aset hanya beberapa MB; pembersihan manual lewat cPanel
      # sesekali sudah cukup.

      # Gerbang akhir: CSS yang dirujuk index.html WAJIB ada di server DAN
      # bisa diambil publik dari mainweb.id. Kalau tidak, deploy merah,
      # bukan hijau lalu situs tampil tanpa style diam-diam.
      - name: Verifikasi CSS ter-serve
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          CSS_REF=$(grep -o '/_next/static/[^"]*\.css' out/index.html | head -1)
          [ -n "$CSS_REF" ] || { echo "::error::out/index.html tidak merujuk CSS manapun"; exit 1; }
          ssh hosting "test -f '$H_PATH$CSS_REF'" \
            || { echo "::error::CSS $CSS_REF tidak ada di hosting, style akan hilang"; exit 1; }
          echo "CSS ada di server: $CSS_REF"
          curl -fsSI "https://mainweb.id$CSS_REF" | grep -iE "HTTP/|content-type" \
            || { echo "::error::CSS tidak bisa diambil publik dari mainweb.id"; exit 1; }
          {
            echo
            echo "### 🔒 CSS terverifikasi ter-serve publik: \`$CSS_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
