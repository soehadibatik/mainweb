name: Deploy to Domainesia Hosting

# Static export (out/) -> folder domain di shared hosting Domainesia via SSH + rsync.
# Perlu repo Variables + Secret, lihat docs/DEPLOY-DOMAINESIA.md.
#
# Kalau konfigurasi belum diisi, job SKIP (hijau) — bukan gagal. Jadi aman
# dipush ke branch main project yang hosting-nya belum disiapkan.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = rsync dry-run, tidak menulis ke server"
        type: boolean
        default: false

concurrency:
  group: deploy-hosting-${{ github.ref }}
  cancel-in-progress: false

env:
  H_HOST: ${{ vars.HOSTING_HOST }}
  H_USER: ${{ vars.HOSTING_USER }}
  H_PATH: ${{ vars.HOSTING_PATH }}
  H_PORT: ${{ vars.HOSTING_PORT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check hosting config
        id: cfg
        env:
          KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$H_HOST" ] || [ -z "$H_USER" ] || [ -z "$H_PATH" ] || [ -z "$KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Deploy hosting di-skip"
              echo
              echo "Konfigurasi belum lengkap. Isi repo **Variables**:"
              echo '`HOSTING_HOST`, `HOSTING_USER`, `HOSTING_PATH`, `HOSTING_PORT`'
              echo "dan secret \`HOSTING_SSH_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "target=$H_USER@$H_HOST:$H_PATH (port ${H_PORT:-64000})" >> "$GITHUB_STEP_SUMMARY"

      - name: Siapkan SSH
        if: steps.cfg.outputs.enabled == 'true'
        env:
          KEY: ${{ secrets.HOSTING_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          {
            echo "Host hosting"
            echo "  HostName $H_HOST"
            # Domainesia shared hosting: SSH/SFTP = port 64000 (bukan 22)
            echo "  Port ${H_PORT:-64000}"
            echo "  User $H_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Koneksi SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh hosting 'echo "connected as $(whoami)@$(hostname)"; pwd'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm

      - name: npm ci
        if: steps.cfg.outputs.enabled == 'true'
        run: npm ci

      # Build static export butuh API key: generateStaticParams() memanggil
      # /api/v1/articles, dan tanpa key hasilnya 401 -> params kosong ->
      # Next.js gagal dengan "missing generateStaticParams()".
      - name: Tulis .env dari secrets
        if: steps.cfg.outputs.enabled == 'true'
        env:
          API_KEY: ${{ secrets.BATIKSOEHADI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$API_KEY" ]; then
            printf 'BATIKSOEHADI_API_KEY=%s\n' "$API_KEY" > .env
          else
            echo "::warning::Secret BATIKSOEHADI_API_KEY kosong — build bisa gagal di route dinamis"
            : > .env
          fi

      - name: npm run build
        if: steps.cfg.outputs.enabled == 'true'
        run: npm run build

      - name: Validasi out/
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "::error::out/index.html tidak ada — static export gagal?"; exit 1; }
          echo "out/ berisi $(find out -type f | wc -l | tr -d ' ') file" >> "$GITHUB_STEP_SUMMARY"

      - name: Pastikan folder tujuan ada
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          ssh hosting "mkdir -p '$H_PATH' && test -d '$H_PATH'" \
            || { echo "::error::Gagal menyiapkan '$H_PATH'. Cek HOSTING_PATH & hak akses folder."; exit 1; }

      # cPanel menyimpan file konfigurasi sendiri di dalam folder domain:
      #   .htaccess  -> directive PHP cPanel (jangan dihapus)
      #   .user.ini  -> setting PHP per-folder (jangan dihapus)
      #   php.ini    -> salinan cPanel (jangan dihapus)
      #   .well-known/ -> dipakai AutoSSL/acme-challenge, hapus = renewal SSL gagal
      # Semuanya dikecualikan dari --delete supaya aman.
      - name: Proteksi file cPanel
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cat > /tmp/rsync-filter <<'EOF'
          protect .htaccess
          protect .user.ini
          protect php.ini
          protect .well-known/
          EOF
          echo "filter dibuat:"
          cat /tmp/rsync-filter

      - name: rsync dry-run
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run == true
        run: |
          set -euo pipefail
          rsync -azn --delete --stats \
            --filter 'merge /tmp/rsync-filter' \
            --exclude '.well-known/' \
            out/ "hosting:$H_PATH/"

      # === Rencana anti "style hilang" ===
      # Aset _next/static ber-nama hash konten: tiap build ganti nama. Browser
      # yang masih pegang HTML lama akan minta aset lama; kalau aset lama
      # dihapus bersamaan HTML ditukar (rsync --delete polos), halaman mereka
      # tampil tanpa style sampai refresh. Urutan amannya:
      #  1) pasang header cache (.htaccess): HTML revalidasi tiap kali,
      #     aset ber-hash aman di-cache setahun
      #  2) unggah aset build baru lebih dulu TANPA menghapus yang lama
      #  3) baru tukar HTML & sisanya (--delete, kecuali _next/static)
      #  4) aset sisa generasi lama dihapus hanya jika berumur >24 jam
      - name: Pasang header cache (.htaccess)
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          cat > /tmp/htaccess-cache <<'HTACCESS'

          # BEGIN mainweb-cache (dipasang otomatis oleh GitHub Actions)
          # HTML tanpa cache: deploy baru langsung terlihat.
          # Aset ber-hash: aman di-cache setahun.
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 0 seconds"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType text/javascript "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType image/svg+xml "access plus 1 month"
            ExpiresByType image/webp "access plus 1 month"
            ExpiresByType image/x-icon "access plus 1 month"
          </IfModule>
          <IfModule mod_headers.c>
            <FilesMatch "\.(css|js|mjs|woff2)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
          </IfModule>
          # END mainweb-cache
          HTACCESS
          # Idempoten: blok hanya di-append jika belum ada; .htaccess milik
          # cPanel tidak pernah ditimpa. Indentasi YAML dibuang saat masuk.
          sed 's/^          //' /tmp/htaccess-cache \
            | ssh hosting "grep -q 'BEGIN mainweb-cache' '$H_PATH/.htaccess' 2>/dev/null || cat >> '$H_PATH/.htaccess'"
          ssh hosting "tail -3 '$H_PATH/.htaccess'"

      # Aset baru masuk duluan; aset lama dibiarkan hidup. Aman karena nama
      # file di-hash dari isinya: nama sama pasti isi sama.
      - name: Unggah aset _next/static lebih dulu
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          ssh hosting "mkdir -p '$H_PATH/_next/static'"
          rsync -az out/_next/static/ "hosting:$H_PATH/_next/static/"

      - name: rsync out/ ke hosting (HTML paling akhir)
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          # _next/static dikecualikan: sudah diunggah di atas, dan TIDAK boleh
          # ikut --delete agar HTML lama di cache browser masih menemukan
          # asetnya selama masa tenggang.
          rsync -az --delete --stats \
            --exclude '/_next/static/' \
            --filter 'merge /tmp/rsync-filter' \
            --exclude '.well-known/' \
            out/ "hosting:$H_PATH/"

      - name: Pastikan file cPanel masih ada
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          ssh hosting "
            miss=0
            for f in .htaccess .user.ini php.ini; do
              [ -f '$H_PATH'/\$f ] || { echo \"::error::\$f hilang di \$H_PATH\"; miss=1; }
            done
            [ -d '$H_PATH'/.well-known ] || { echo \"::error::.well-known hilang di \$H_PATH\"; miss=1; }
            exit \$miss
          "

      - name: Verifikasi
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          ssh hosting "ls -1 '$H_PATH' | head -20"
          {
            echo
            echo "### ✅ Ter-deploy ke \`$H_USER@$H_HOST:$H_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sisa aset generasi lama (tidak ada di build sekarang) dihapus hanya
      # jika berumur >24 jam: masa tenggang bagi HTML lama di cache browser.
      - name: Bersihkan aset statis generasi lama
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          (cd out/_next/static && LC_ALL=C find . -type f | LC_ALL=C sort) > /tmp/aset-baru.txt
          ssh hosting "cd '$H_PATH/_next/static' && LC_ALL=C find . -type f | LC_ALL=C sort" > /tmp/aset-terpasang.txt
          SISA=$(comm -23 /tmp/aset-terpasang.txt /tmp/aset-baru.txt | wc -l | tr -d ' ')
          comm -23 /tmp/aset-terpasang.txt /tmp/aset-baru.txt \
            | ssh hosting "cd '$H_PATH/_next/static' && while IFS= read -r f; do [ -n \"\$f\" ] && find \"\$f\" -mtime +0 -delete; done; true"
          echo "sisa aset lama dievaluasi (hapus jika >24 jam): $SISA file"

      # Kalau CSS yang dirujuk index.html tidak ada di server, halaman tampil
      # tanpa style. Gagal di sini berarti deploy merah, bukan hijau lalu
      # situs rusak diam-diam.
      - name: Verifikasi CSS ter-serve
        if: steps.cfg.outputs.enabled == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          ssh hosting "css=\$(grep -o '/_next/static/[^\"]*\.css' '$H_PATH/index.html' | head -1); [ -n \"\$css\" ] || { echo '::error::index.html tidak merujuk CSS manapun'; exit 1; }; [ -f '$H_PATH\$css' ] || { echo \"::error::CSS \$css tidak ada di hosting, style akan hilang\"; exit 1; }; echo \"CSS ok: \$css\""
          {
            echo
            echo "### 🔒 Verifikasi CSS ok"
          } >> "$GITHUB_STEP_SUMMARY"
